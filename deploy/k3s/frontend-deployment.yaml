apiVersion: apps/v1
kind: Deployment
metadata:
  name: tuddybuddy-frontend
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: tuddybuddy-frontend
  template:
    metadata:
      labels:
        app: tuddybuddy-frontend
    spec:
      containers:
        - name: frontend
          image: __IMAGE__
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
