  <text x="1346" y="1091" text-anchor="middle" class="body">Groq 정답·해설 교차검증</text>
  <text x="1346" y="1124" text-anchor="middle" class="small">실패 문항은 사유를 반영해 재생성</text>
  <path d="M1478 1082 H1503" stroke="#2876da" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

  <rect x="1512" y="1010" width="206" height="144" rx="14" class="nodeGreen"/>
  <text x="1615" y="1040" text-anchor="middle" class="label green">Spring 저장</text>
  <text x="1615" y="1068" text-anchor="middle" class="body">응답 재검증</text>
