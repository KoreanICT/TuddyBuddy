  <text x="1207" y="814" text-anchor="middle" class="small">약점·학습 경로 / 최근 평균·예측 점수</text>
  <path d="M1388 790 H1424" stroke="#2876da" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

  <rect x="1433" y="734" width="282" height="112" rx="14" class="nodeGreen"/>
  <text x="1574" y="762" text-anchor="middle" class="label green">Spring 통합 응답</text>
  <text x="1574" y="788" text-anchor="middle" class="body">응답 검증 + 차트 데이터 결합</text>
  <text x="1574" y="814" text-anchor="middle" class="small">{chartData, llmFeedback}</text>

  <!-- Lane 3: Quiz generation -->
  <rect x="45" y="908" width="1710" height="340" rx="22" fill="#ffffff" stroke="#c8d9ed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="45" y="908" width="10" height="340" rx="5" fill="#7456c7"/>
  <circle cx="86" cy="946" r="18" fill="#eee8ff"/><text x="86" y="953" text-anchor="middle" class="label purple">3</text>
