  <path d="M1346 1165 C1346 1204 1050 1204 1050 1165" fill="none" stroke="#7456c7" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrowBlue)"/>
  <rect x="1068" y="1176" width="258" height="27" rx="13" fill="#f5f1ff"/>
  <text x="1197" y="1195" text-anchor="middle" class="tiny purple">검증 실패 시 제한된 재생성 반복</text>

  <!-- Footer -->
  <text x="58" y="1288" class="small">읽는 방향: 사용자 요청 → React → Spring → 기능별 AI 처리 → Spring 저장·조합 → 프론트 결과</text>
  <text x="1740" y="1288" text-anchor="end" class="small">기본 CRUD · SSE 알림 · 운영 인프라는 별도 아키텍처</text>
</svg>
