<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-labelledby="title desc">
  <title id="title">TuddyBuddy AI 기능 아키텍처</title>
  <desc id="desc">React 프론트엔드, Spring Boot, 저장소 및 세 AI 서버의 연결과 버디봇, 통계 분석, 퀴즈 생성의 요청 흐름을 보여준다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="spring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#effcf4"/>
      <stop offset="1" stop-color="#e4f7eb"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#eaf0ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#15345b" flood-opacity=".09"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2876da"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e9b5f"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #132544; }
      .title { font-size: 48px; font-weight: 800; letter-spacing: -1.3px; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #60718b; }
      .section { font-size: 23px; font-weight: 800; }
      .label { font-size: 18px; font-weight: 750; }
      .body { font-size: 15px; font-weight: 500; fill: #4e6078; }
      .small { font-size: 13px; font-weight: 500; fill: #60718b; }
      .tiny { font-size: 11px; font-weight: 600; fill: #60718b; }
      .white { fill: #ffffff; }
      .blue { fill: #1456b8; }
      .green { fill: #167343; }
      .purple { fill: #6045aa; }
      .card { fill: #ffffff; stroke: #c9d9ec; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #cad8ea; stroke-width: 1.3; }
      .nodeBlue { fill: #f4f9ff; stroke: #b9d4f5; stroke-width: 1.3; }
      .nodeGreen { fill: #f4fcf7; stroke: #b5e0c4; stroke-width: 1.3; }
      .nodePurple { fill: #f8f6ff; stroke: #d0c4f2; stroke-width: 1.3; }
    </style>
  </defs>

  <rect width="1800" height="1320" fill="url(#bg)"/>
  <circle cx="1680" cy="20" r="170" fill="#dcecff" opacity=".28"/>
  <circle cx="110" cy="1260" r="205" fill="#e2f7ec" opacity=".34"/>

  <!-- Header -->
  <text x="54" y="72" class="title"><tspan fill="#1456b8">TuddyBuddy</tspan><tspan> AI 기능 아키텍처</tspan></text>
  <text x="57" y="111" class="subtitle">프론트 요청을 Spring이 검증·조정하고, 기능별 AI 서버가 검색·분석·생성한 결과를 저장해 반환합니다.</text>
  <rect x="1505" y="47" width="238" height="42" rx="21" fill="#e6efff" stroke="#c6d8f3"/>
  <text x="1624" y="74" text-anchor="middle" class="small blue" style="font-weight:750">기능 구현 관점 · 코드 기준</text>

  <!-- System overview -->
  <rect x="45" y="145" width="1710" height="185" rx="22" fill="#ffffff" stroke="#c8d9ed" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="72" y="180" class="section">서비스 연결 개요</text>
  <text x="1718" y="179" text-anchor="end" class="small">요청·응답은 동기 HTTP · SSE 흐름은 별도 기능</text>

  <rect x="86" y="207" width="156" height="86" rx="15" class="node"/>
  <circle cx="118" cy="242" r="13" fill="#dceaff"/>
  <circle cx="118" cy="237" r="5" fill="#2876da"/>
  <path d="M107 257 Q118 244 129 257" fill="#2876da"/>
