  <text x="470" y="1091" text-anchor="middle" class="body">과목 카탈로그 조회</text>
  <text x="470" y="1124" text-anchor="middle" class="small">AI 서버에 multipart 전달</text>
  <path d="M602 1082 H627" stroke="#2876da" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

