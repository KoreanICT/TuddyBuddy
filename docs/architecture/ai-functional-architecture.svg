  <text x="762" y="1091" text-anchor="middle" class="body">주제·언어·분류</text>
  <text x="762" y="1124" text-anchor="middle" class="small">/api/ai/generate-quiz</text>
  <path d="M894 1082 H919" stroke="#7057bd" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

  <rect x="928" y="1010" width="252" height="144" rx="14" class="node"/>
  <text x="1054" y="1040" text-anchor="middle" class="label">RAG + Gemini</text>
  <text x="1054" y="1068" text-anchor="middle" class="body">관련 학습 청크 검색</text>
  <text x="1054" y="1091" text-anchor="middle" class="body">문제·보기·정답·해설 생성</text>
  <text x="1054" y="1124" text-anchor="middle" class="small">유형·난이도·개수 반영</text>
  <path d="M1186 1082 H1211" stroke="#2876da" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

  <rect x="1220" y="1010" width="252" height="144" rx="14" class="nodePurple"/>
