  <text x="1584" y="670" text-anchor="middle" class="small" fill="#8a5b00" style="font-weight:700">POST /statistics · /prediction</text>
  <text x="82" y="709" class="small">풀이 데이터 조회 → 두 AI 분석 호출 → 차트 데이터와 결합 → 화면 표시</text>

  <rect x="82" y="734" width="245" height="112" rx="14" class="nodeBlue"/>
  <text x="204" y="762" text-anchor="middle" class="label">React Analytics</text>
  <text x="204" y="788" text-anchor="middle" class="body">회원 카테고리·분석 요청</text>
  <text x="204" y="814" text-anchor="middle" class="small">차트 · 피드백 표시</text>
  <path d="M333 790 H369" stroke="#2876da" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

  <rect x="378" y="734" width="292" height="112" rx="14" class="nodeGreen"/>
  <text x="524" y="762" text-anchor="middle" class="label green">Spring + DB</text>
  <text x="524" y="788" text-anchor="middle" class="body">풀이 로그·통계 조회</text>
  <text x="524" y="814" text-anchor="middle" class="small">포인트 처리 · 요청 구성</text>
  <path d="M676 790 H712" stroke="#2876da" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

  <rect x="721" y="734" width="260" height="112" rx="14" class="nodePurple"/>
  <text x="851" y="762" text-anchor="middle" class="label purple">통계 AI FastAPI</text>
  <text x="851" y="788" text-anchor="middle" class="body">카테고리 그룹화</text>
  <text x="851" y="814" text-anchor="middle" class="small">분석 · 예측 각각 호출</text>
  <path d="M987 790 H1023" stroke="#7057bd" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

