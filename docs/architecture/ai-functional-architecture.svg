  <text x="1574" y="510" text-anchor="middle" class="body">AI 답변을 DB에 저장</text>
  <text x="1574" y="536" text-anchor="middle" class="small">React에 {answer} 반환</text>

  <!-- Lane 2: Statistics -->
  <rect x="45" y="630" width="1710" height="258" rx="22" fill="#ffffff" stroke="#c8d9ed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="45" y="630" width="10" height="258" rx="5" fill="#e3a52d"/>
  <circle cx="86" cy="668" r="18" fill="#fff2d7"/><text x="86" y="675" text-anchor="middle" class="label" fill="#9a6500">2</text>
