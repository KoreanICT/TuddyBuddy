  <text x="164" y="266" text-anchor="middle" class="small">질문 · 이미지 · 조회</text>

  <path d="M248 250 H318" stroke="#2876da" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="282" y="237" text-anchor="middle" class="tiny blue">화면 동작</text>

  <rect x="329" y="207" width="266" height="86" rx="15" class="nodeBlue"/>
  <rect x="347" y="224" width="43" height="43" rx="9" fill="#dff6fb"/>
  <path d="M368 232 L382 239 L382 254 L368 261 L354 254 L354 239 Z" fill="none" stroke="#15a9c8" stroke-width="3"/>
  <text x="482" y="242" text-anchor="middle" class="label">React · TypeScript</text>
  <text x="482" y="266" text-anchor="middle" class="small">입력 · 요청 · 결과 표시</text>

  <path d="M601 250 H686" stroke="#2876da" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="643" y="237" text-anchor="middle" class="tiny blue">HTTP / REST</text>

  <rect x="697" y="195" width="390" height="111" rx="18" fill="url(#spring)" stroke="#8dcba3" stroke-width="1.7"/>
  <text x="892" y="228" text-anchor="middle" class="label green" style="font-size:22px">Spring Boot API</text>
  <text x="892" y="254" text-anchor="middle" class="body">인증 · 권한 · 입력 검증 · 업무 로직</text>
  <text x="892" y="278" text-anchor="middle" class="body">AI 호출 · 결과 검증 · 저장 / 통합 응답</text>

  <path d="M1094 250 H1180" stroke="#2e9b5f" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1137" y="237" text-anchor="middle" class="tiny green">MyBatis / 파일 I/O</text>

  <rect x="1191" y="207" width="222" height="86" rx="15" class="nodeGreen"/>
  <ellipse cx="1228" cy="231" rx="19" ry="7" fill="#36a96b"/>
  <path d="M1209 231 V259 C1209 268 1247 268 1247 259 V231" fill="#8ed9aa" stroke="#36a96b" stroke-width="2"/>
  <ellipse cx="1228" cy="259" rx="19" ry="7" fill="#58bd7e"/>
  <text x="1323" y="242" text-anchor="middle" class="label">DB · 파일 저장소</text>
  <text x="1323" y="266" text-anchor="middle" class="small">회원 · 학습 · 대화 · 이미지</text>

  <path d="M1093 220 C1140 184 1416 184 1460 220" fill="none" stroke="#2876da" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text x="1280" y="197" text-anchor="middle" class="tiny blue">HTTP · 기능별 AI API</text>
  <rect x="1471" y="207" width="234" height="86" rx="15" class="nodePurple"/>
  <circle cx="1505" cy="242" r="17" fill="#dcd2ff"/>
  <path d="M1497 242 Q1505 230 1513 242 Q1505 254 1497 242" fill="#7057bd"/>
  <text x="1602" y="242" text-anchor="middle" class="label purple">AI FastAPI 서버</text>
  <text x="1602" y="266" text-anchor="middle" class="small">챗봇 · 통계 · 퀴즈 생성</text>

  <!-- Lane 1: Chatbot -->
  <rect x="45" y="352" width="1710" height="258" rx="22" fill="#ffffff" stroke="#c8d9ed" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="45" y="352" width="10" height="258" rx="5" fill="#2876da"/>
  <circle cx="86" cy="390" r="18" fill="#e3efff"/><text x="86" y="397" text-anchor="middle" class="label blue">1</text>
  <text x="117" y="398" class="section">버디봇 안내 대화</text>
  <rect x="1460" y="370" width="255" height="34" rx="17" fill="#edf4ff"/>
  <text x="1587" y="392" text-anchor="middle" class="small blue" style="font-weight:700">POST /api/chatbot/ai → /chat</text>
  <text x="82" y="431" class="small">질문 저장 → 회원 유형에 맞는 문서 검색 → 답변 생성 → 대화 저장</text>

  <rect x="82" y="456" width="245" height="112" rx="14" class="nodeBlue"/>
  <text x="204" y="484" text-anchor="middle" class="label">React ChatBot</text>
  <text x="204" y="510" text-anchor="middle" class="body">질문 + chat_num 전송</text>
  <text x="204" y="536" text-anchor="middle" class="small">답변 표시</text>
  <path d="M333 512 H369" stroke="#2876da" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

  <rect x="378" y="456" width="292" height="112" rx="14" class="nodeGreen"/>
  <text x="524" y="484" text-anchor="middle" class="label green">Spring Boot</text>
  <text x="524" y="510" text-anchor="middle" class="body">세션 소유권 확인 · 질문 저장</text>
  <text x="524" y="536" text-anchor="middle" class="small">MEMBER / GUEST 판정</text>
  <path d="M676 512 H712" stroke="#2876da" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

  <rect x="721" y="456" width="260" height="112" rx="14" class="nodePurple"/>
  <text x="851" y="484" text-anchor="middle" class="label purple">챗봇 FastAPI</text>
  <text x="851" y="510" text-anchor="middle" class="body">POST /chat</text>
  <text x="851" y="536" text-anchor="middle" class="small">RAG 검색 요청</text>
  <path d="M987 512 H1023" stroke="#7057bd" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

  <rect x="1032" y="456" width="350" height="112" rx="14" class="node"/>
  <text x="1207" y="484" text-anchor="middle" class="label">FAISS + Gemini</text>
  <text x="1207" y="510" text-anchor="middle" class="body">정책 PDF 청크 최대 3개 검색</text>
  <text x="1207" y="536" text-anchor="middle" class="small">MEMBER: COMMON+MEMBER · GUEST: COMMON</text>
  <path d="M1388 512 H1424" stroke="#2876da" stroke-width="2.6" marker-end="url(#arrowBlue)"/>

  <rect x="1433" y="456" width="282" height="112" rx="14" class="nodeGreen"/>
