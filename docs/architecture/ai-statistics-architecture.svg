<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060" role="img" aria-labelledby="title desc">
  <title id="title">TuddyBuddy 평가 분석 및 성적 예측 기능 아키텍처</title>
  <desc id="desc">React가 Spring에 분석을 요청하고 Spring이 풀이 데이터를 조회한 후 FastAPI의 평가 분석과 예측 API를 각각 호출한다. 각 기능은 Chroma RAG와 Gemini를 사용하고 Spring이 차트 데이터와 통합해 반환한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#15345b" flood-opacity=".09"/></filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2876da"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e9b5f"/></marker>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;fill:#132544}.title{font-size:42px;font-weight:800;letter-spacing:-1px}.sub{font-size:19px;fill:#60718b}.head{font-size:21px;font-weight:800}.label{font-size:17px;font-weight:750}.body{font-size:14px;fill:#4e6078}.small{font-size:12px;fill:#60718b}.tiny{font-size:11px;fill:#60718b}.blue{fill:#1456b8}.greenText{fill:#167343}.purpleText{fill:#6045aa}.amberText{fill:#8a5b00}.card{fill:#fff;stroke:#cbd9eb;stroke-width:1.4}.blueCard{fill:#f4f9ff;stroke:#b9d4f5;stroke-width:1.4}.greenCard{fill:#f4fcf7;stroke:#b5e0c4;stroke-width:1.4}.purpleCard{fill:#f8f6ff;stroke:#d0c4f2;stroke-width:1.4}.amberCard{fill:#fff9ec;stroke:#efd99d;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1600" height="1060" fill="url(#bg)"/><circle cx="1510" cy="10" r="145" fill="#dcecff" opacity=".3"/>
  <text x="52" y="68" class="title"><tspan fill="#1456b8">TuddyBuddy</tspan> 평가 분석 · 성적 예측</text>
  <text x="55" y="105" class="sub">풀이 이력 기반 분석과 예측을 별도 AI 요청으로 수행한 뒤 Spring이 하나의 화면 응답으로 조합합니다.</text>
  <rect x="1340" y="45" width="210" height="38" rx="19" fill="#fff3d8"/><text x="1445" y="70" text-anchor="middle" class="small amberText" style="font-weight:700">2개의 동기 AI 호출</text>

  <!-- Front & orchestration -->
  <rect x="48" y="140" width="1504" height="192" rx="20" class="card" filter="url(#shadow)"/>
  <text x="76" y="177" class="head">① 화면 요청 · Spring 오케스트레이션</text>
  <rect x="82" y="201" width="260" height="96" rx="14" class="blueCard"/>
  <text x="212" y="233" text-anchor="middle" class="label">React PerformanceAnalytics</text><text x="212" y="259" text-anchor="middle" class="body">카테고리 조회 후 분석 요청</text><text x="212" y="281" text-anchor="middle" class="small">POST /api/statistics/getStatistics</text>
  <path d="M350 249H407" stroke="#2876da" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="417" y="194" width="430" height="110" rx="15" fill="#effbf3" stroke="#8dcba3" stroke-width="1.5"/>
  <text x="632" y="227" text-anchor="middle" class="label greenText">Spring StatisticsService</text><text x="632" y="253" text-anchor="middle" class="body">회원 확인 · 포인트 처리 · 분석 요청 구성</text><text x="632" y="278" text-anchor="middle" class="small">AI 호출은 DB 트랜잭션 밖의 동기 HTTP</text>
  <path d="M855 249H912" stroke="#2876da" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="922" y="201" width="270" height="96" rx="14" class="card"/>
  <text x="1057" y="233" text-anchor="middle" class="label">Oracle DB</text><text x="1057" y="259" text-anchor="middle" class="body">풀이 로그 · 차트 데이터</text><text x="1057" y="281" text-anchor="middle" class="small">회원별 조회</text>
  <path d="M1200 249H1257" stroke="#2876da" stroke-width="3" marker-end="url(#blueArrow)"/>
  <rect x="1267" y="201" width="245" height="96" rx="14" class="purpleCard"/>
  <text x="1389" y="233" text-anchor="middle" class="label purpleText">Statistics FastAPI</text><text x="1389" y="259" text-anchor="middle" class="body">/statistics · /prediction</text><text x="1389" y="281" text-anchor="middle" class="small">두 API를 순서대로 호출</text>

  <!-- Analysis branch -->
  <rect x="48" y="354" width="1504" height="250" rx="20" class="card" filter="url(#shadow)"/>
  <rect x="48" y="354" width="9" height="250" rx="4" fill="#2876da"/>
  <text x="76" y="391" class="head">②-A 카테고리별 평가 분석</text>
  <rect x="1313" y="370" width="207" height="32" rx="16" fill="#eaf2ff"/><text x="1416" y="391" text-anchor="middle" class="small blue" style="font-weight:700">POST /statistics</text>
  <rect x="82" y="425" width="260" height="130" rx="14" class="greenCard"/>
  <text x="212" y="455" text-anchor="middle" class="label greenText">Spring 요청 데이터</text><text x="212" y="482" text-anchor="middle" class="body">회원 풀이 로그 조회</text><text x="212" y="505" text-anchor="middle" class="small">user_id + quiz_logs</text><text x="212" y="531" text-anchor="middle" class="tiny">SQL 조인 결과 전달</text>
  <path d="M350 490H386" stroke="#2876da" stroke-width="2.7" marker-end="url(#blueArrow)"/>
  <rect x="396" y="425" width="265" height="130" rx="14" class="purpleCard"/>
  <text x="528" y="455" text-anchor="middle" class="label purpleText">카테고리 그룹화</text><text x="528" y="482" text-anchor="middle" class="body">기록을 카테고리별 정리</text><text x="528" y="505" text-anchor="middle" class="small">카테고리 간 근거 분리</text><text x="528" y="531" text-anchor="middle" class="tiny">입력 순서·식별자 보존</text>
  <path d="M669 490H705" stroke="#2876da" stroke-width="2.7" marker-end="url(#blueArrow)"/>
  <rect x="715" y="425" width="300" height="130" rx="14" class="blueCard"/>
  <text x="865" y="455" text-anchor="middle" class="label blue">Chroma RAG</text><text x="865" y="482" text-anchor="middle" class="body">study_guidance 컬렉션 검색</text><text x="865" y="505" text-anchor="middle" class="small">오답 주제에 맞는 학습 가이드</text><text x="865" y="531" text-anchor="middle" class="tiny">검색 실패 시 가이드 없이 진행</text>
  <path d="M1023 490H1059" stroke="#2876da" stroke-width="2.7" marker-end="url(#blueArrow)"/>
  <rect x="1069" y="425" width="445" height="130" rx="14" class="amberCard"/>
  <text x="1291" y="455" text-anchor="middle" class="label amberText">Gemini · 구조화 응답</text><text x="1291" y="482" text-anchor="middle" class="body">멘토 의견 · 확인된 약점</text><text x="1291" y="505" text-anchor="middle" class="body">카테고리별 3단계 학습 경로</text><text x="1291" y="531" text-anchor="middle" class="tiny">응답 카테고리·필수 항목 검증</text>

  <!-- Prediction branch -->
  <rect x="48" y="626" width="1504" height="250" rx="20" class="card" filter="url(#shadow)"/>
  <rect x="48" y="626" width="9" height="250" rx="4" fill="#e3a52d"/>
  <text x="76" y="663" class="head">②-B 카테고리별 성적 예측</text>
  <rect x="1313" y="642" width="207" height="32" rx="16" fill="#fff3d8"/><text x="1416" y="663" text-anchor="middle" class="small amberText" style="font-weight:700">POST /prediction</text>
  <rect x="82" y="697" width="260" height="130" rx="14" class="greenCard"/>
  <text x="212" y="727" text-anchor="middle" class="label greenText">Spring 요청 데이터</text><text x="212" y="754" text-anchor="middle" class="body">카테고리별 통계 조회</text><text x="212" y="777" text-anchor="middle" class="small">평균·시도 수·최고/최저</text><text x="212" y="803" text-anchor="middle" class="tiny">categoryStatsList 전달</text>
  <path d="M350 762H386" stroke="#2876da" stroke-width="2.7" marker-end="url(#blueArrow)"/>
  <rect x="396" y="697" width="265" height="130" rx="14" class="purpleCard"/>
  <text x="528" y="727" text-anchor="middle" class="label purpleText">집계 · 그룹화</text><text x="528" y="754" text-anchor="middle" class="body">중복 카테고리 통합</text><text x="528" y="777" text-anchor="middle" class="small">시도 수 기준 가중 평균</text><text x="528" y="803" text-anchor="middle" class="tiny">통계 근거와 집계 방식 유지</text>
  <path d="M669 762H705" stroke="#2876da" stroke-width="2.7" marker-end="url(#blueArrow)"/>
  <rect x="715" y="697" width="300" height="130" rx="14" class="blueCard"/>
  <text x="865" y="727" text-anchor="middle" class="label blue">Chroma RAG</text><text x="865" y="754" text-anchor="middle" class="body">prediction_policy 컬렉션 검색</text><text x="865" y="777" text-anchor="middle" class="small">예측 기준·유의사항 검색</text><text x="865" y="803" text-anchor="middle" class="tiny">검색 실패 시 기준 없이 진행</text>
  <path d="M1023 762H1059" stroke="#2876da" stroke-width="2.7" marker-end="url(#blueArrow)"/>
  <rect x="1069" y="697" width="445" height="130" rx="14" class="amberCard"/>
  <text x="1291" y="727" text-anchor="middle" class="label amberText">Gemini · 구조화 응답</text><text x="1291" y="754" text-anchor="middle" class="body">최근 평균(actual) · 다음 시험 예측(predict)</text><text x="1291" y="777" text-anchor="middle" class="body">카테고리별 멘토 의견과 예측 한계</text><text x="1291" y="803" text-anchor="middle" class="tiny">점수 0~100 · 응답 형식 검증</text>

  <!-- Integration and response -->
  <rect x="48" y="898" width="1504" height="124" rx="20" class="card" filter="url(#shadow)"/>
  <text x="76" y="935" class="head">③ Spring 통합 · React 표시</text>
  <rect x="370" y="918" width="405" height="74" rx="13" class="greenCard"/><text x="572" y="947" text-anchor="middle" class="label greenText">응답 검증 + 차트 데이터 결합</text><text x="572" y="973" text-anchor="middle" class="body">history · prediction · subjectShare + llmFeedback</text>
  <path d="M782 955H878" stroke="#2e9b5f" stroke-width="3" marker-end="url(#greenArrow)"/>
  <rect x="888" y="918" width="275" height="74" rx="13" class="blueCard"/><text x="1025" y="947" text-anchor="middle" class="label">React 화면</text><text x="1025" y="973" text-anchor="middle" class="body">차트 · 약점 · 학습 경로 표시</text>
  <rect x="1190" y="918" width="320" height="74" rx="13" fill="#f4f6fa" stroke="#d7dfeb"/><text x="1350" y="947" text-anchor="middle" class="small" style="font-weight:700">브라우저 분석 결과 캐시</text><text x="1350" y="973" text-anchor="middle" class="small">멤버 · 선택 카테고리 기준</text>
  <path d="M1155 955H1180" stroke="#2876da" stroke-width="2.3" marker-end="url(#blueArrow)"/>
  <text x="800" y="1044" text-anchor="middle" class="small">실패·빈 입력은 API 오류로 처리되며, 분석 결과가 완성되어야 Spring의 요청 트랜잭션이 정상 종료됩니다.</text>
</svg>
