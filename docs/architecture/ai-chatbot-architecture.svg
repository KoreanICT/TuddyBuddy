<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TuddyBuddy 버디봇 기능 아키텍처</title>
  <desc id="desc">React 질문 요청이 Spring 세션 검증과 저장을 거쳐 FastAPI RAG, FAISS 문서 검색, Gemini 답변 생성으로 이어지고 결과가 다시 저장되어 사용자에게 반환된다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#edf5ff"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#effcf4"/><stop offset="1" stop-color="#e5f7ec"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f5f7ff"/><stop offset="1" stop-color="#eaf0ff"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#15345b" flood-opacity=".09"/></filter>
    <marker id="blueArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2876da"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2e9b5f"/></marker>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;fill:#132544}.title{font-size:43px;font-weight:800;letter-spacing:-1px}.sub{font-size:19px;fill:#60718b}.head{font-size:21px;font-weight:800}.label{font-size:18px;font-weight:750}.body{font-size:15px;fill:#4e6078}.small{font-size:13px;fill:#60718b}.tiny{font-size:11px;fill:#60718b}.blue{fill:#1456b8}.greenText{fill:#167343}.purpleText{fill:#6045aa}.card{fill:#fff;stroke:#cbd9eb;stroke-width:1.4}.blueCard{fill:#f4f9ff;stroke:#b9d4f5;stroke-width:1.4}.greenCard{fill:#f4fcf7;stroke:#b5e0c4;stroke-width:1.4}.purpleCard{fill:#f8f6ff;stroke:#d0c4f2;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1500" cy="30" r="150" fill="#dcecff" opacity=".3"/>
  <text x="52" y="68" class="title"><tspan fill="#1456b8">TuddyBuddy</tspan> 버디봇 기능 아키텍처</text>
  <text x="55" y="105" class="sub">질문을 회원 권한에 맞는 안내 문서와 연결해 답변하고, 대화 이력을 저장합니다.</text>
  <rect x="1335" y="45" width="215" height="38" rx="19" fill="#e8f0ff"/><text x="1442" y="70" text-anchor="middle" class="small blue" style="font-weight:700">동기 HTTP · POST</text>

  <!-- Request -->
  <rect x="48" y="140" width="1504" height="170" rx="20" class="card" filter="url(#shadow)"/>
  <text x="75" y="177" class="head">① 질문 요청 · 세션 권한 확인</text>
  <rect x="88" y="201" width="255" height="78" rx="13" class="blueCard"/>
  <text x="215" y="231" text-anchor="middle" class="label">React ChatBot</text><text x="215" y="256" text-anchor="middle" class="body">chat_num · question 전송</text>
  <path d="M350 240H435" stroke="#2876da" stroke-width="3" marker-end="url(#blueArrow)"/><text x="392" y="226" text-anchor="middle" class="tiny blue">HTTP JSON</text>
  <rect x="445" y="194" width="470" height="92" rx="14" fill="url(#green)" stroke="#8dcba3" stroke-width="1.5"/>
  <text x="680" y="224" text-anchor="middle" class="label greenText">Spring ChatController · ChatBotService</text>
  <text x="680" y="249" text-anchor="middle" class="body">채팅 세션 확인 · 질문 유효성 검사</text><text x="680" y="271" text-anchor="middle" class="small">회원 JWT / 비회원 브라우저 세션 소유권 확인</text>
  <path d="M920 240H1005" stroke="#2876da" stroke-width="3" marker-end="url(#blueArrow)"/><text x="962" y="226" text-anchor="middle" class="tiny blue">질문 저장</text>
  <rect x="1015" y="201" width="230" height="78" rx="13" class="card"/>
  <text x="1130" y="231" text-anchor="middle" class="label">Oracle DB</text><text x="1130" y="256" text-anchor="middle" class="body">사용자 메시지 저장</text>
  <rect x="1280" y="201" width="235" height="78" rx="13" fill="#fff8e9" stroke="#edd7a8" stroke-width="1.3"/>
  <text x="1397" y="231" text-anchor="middle" class="label">권한 유형 결정</text><text x="1397" y="256" text-anchor="middle" class="body">MEMBER 또는 GUEST</text>

  <!-- AI internal -->
  <rect x="48" y="332" width="1504" height="400" rx="20" class="card" filter="url(#shadow)"/>
  <rect x="48" y="332" width="9" height="400" rx="4" fill="#7057bd"/>
  <text x="75" y="370" class="head">② 챗봇 FastAPI 내부 · RAG 문서 검색과 답변 생성</text>
  <text x="1518" y="369" text-anchor="end" class="small purpleText">POST /chat  ·  {question, user_type}</text>
  <rect x="88" y="408" width="220" height="100" rx="14" class="purpleCard"/>
  <text x="198" y="440" text-anchor="middle" class="label purpleText">FastAPI /chat</text><text x="198" y="466" text-anchor="middle" class="body">요청 수신 · 빈 질문 처리</text><text x="198" y="489" text-anchor="middle" class="small">user_type 대문자 변환</text>
  <path d="M315 458H360" stroke="#2876da" stroke-width="2.6" marker-end="url(#blueArrow)"/>
  <rect x="370" y="408" width="280" height="100" rx="14" class="card"/>
  <text x="510" y="440" text-anchor="middle" class="label">회원 유형 필터</text><text x="510" y="466" text-anchor="middle" class="body">MEMBER: COMMON + MEMBER</text><text x="510" y="489" text-anchor="middle" class="body">GUEST: COMMON만</text>
  <path d="M657 458H702" stroke="#2876da" stroke-width="2.6" marker-end="url(#blueArrow)"/>
  <rect x="712" y="408" width="300" height="100" rx="14" class="blueCard"/>
  <text x="862" y="440" text-anchor="middle" class="label blue">FAISS 정책 인덱스</text><text x="862" y="466" text-anchor="middle" class="body">질문 유사도 검색</text><text x="862" y="489" text-anchor="middle" class="small">관련 안내 PDF 청크 최대 3개</text>
  <path d="M1019 458H1064" stroke="#2876da" stroke-width="2.6" marker-end="url(#blueArrow)"/>
  <rect x="1074" y="408" width="425" height="100" rx="14" class="greenCard"/>
  <text x="1286" y="440" text-anchor="middle" class="label greenText">Gemini 답변 생성</text><text x="1286" y="466" text-anchor="middle" class="body">검색 문서만 근거로 안내 답변 작성</text><text x="1286" y="489" text-anchor="middle" class="small">문서에 없는 내용은 추측하지 않도록 지시</text>

  <rect x="370" y="544" width="1129" height="125" rx="14" fill="#f7f9fc" stroke="#dce4ee"/>
  <text x="400" y="579" class="label">답변 프롬프트 원칙</text>
  <text x="400" y="610" class="body">· 질문이 명확하면 문서 근거로 답변하고, 정보가 없으면 확인 불가 안내</text>
  <text x="400" y="638" class="body">· 짧고 정중한 Markdown 답변 생성 · 이전 대화 문맥은 요청에 포함하지 않음</text>
  <path d="M1286 516V532" stroke="#2e9b5f" stroke-width="2.6" marker-end="url(#greenArrow)"/>
  <text x="1312" y="531" class="tiny greenText">answer</text>

  <!-- Return -->
  <rect x="48" y="753" width="1504" height="177" rx="20" class="card" filter="url(#shadow)"/>
  <text x="75" y="790" class="head">③ 답변 저장 · 프론트 응답</text>
  <rect x="88" y="814" width="390" height="82" rx="13" class="purpleCard"/>
  <text x="283" y="845" text-anchor="middle" class="label purpleText">FastAPI → Spring</text><text x="283" y="871" text-anchor="middle" class="body">JSON {answer}</text>
  <path d="M485 855H565" stroke="#2e9b5f" stroke-width="3" marker-end="url(#greenArrow)"/>
  <rect x="575" y="814" width="370" height="82" rx="13" class="greenCard"/>
  <text x="760" y="845" text-anchor="middle" class="label greenText">Spring ChatBotService</text><text x="760" y="871" text-anchor="middle" class="body">AI 응답 확인 · 봇 메시지 저장</text>
  <path d="M952 855H1032" stroke="#2e9b5f" stroke-width="3" marker-end="url(#greenArrow)"/>
  <rect x="1042" y="814" width="210" height="82" rx="13" class="card"/>
  <text x="1147" y="845" text-anchor="middle" class="label">Oracle DB</text><text x="1147" y="871" text-anchor="middle" class="body">봇 답변 저장</text>
  <path d="M1258 855H1328" stroke="#2e9b5f" stroke-width="3" marker-end="url(#greenArrow)"/>
  <rect x="1338" y="814" width="178" height="82" rx="13" class="blueCard"/>
  <text x="1427" y="845" text-anchor="middle" class="label">React</text><text x="1427" y="871" text-anchor="middle" class="body">답변 표시</text>
  <rect x="48" y="950" width="1504" height="32" rx="12" fill="#fff4f1" stroke="#f0c7bd"/>
  <text x="70" y="972" class="small" fill="#994a3a"><tspan style="font-weight:750">오류 처리:</tspan> 잘못된 질문은 400 · 세션/소유권 오류는 404/403 · AI 연결 실패 또는 빈 응답은 503 안내</text>
</svg>
